<!DOCTYPE html>
<html>

<head>
    <title>The Nothing Archive</title>

    <style>
        body {
            background: white;
            color: black;
            font-family: Georgia, "Times New Roman", serif;
            margin: 0;
        }

        .page {
            width: 650px;
            max-width: 85%;
            margin: 100px auto;
            display: flex;
            align-items: stretch;
        }

        .line {
            width: 1px;
            background: black;
        }

        .writing {
            flex: 1;
            padding: 0 35px;
            text-align: left;
        }

        .date {
            font-size: 14px;
            margin-bottom: 30px;
        }

        p {
            line-height: 1.6;
        }

        a {
            color: blue;
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="line"></div>

        <div class="writing">

            <div class="date">09/20/2026</div>

            <p>
                Write your entry here. The writing sits between
                two simple vertical lines.
            </p>

            <p>
                Add more paragraphs whenever you want.
            </p>

        </div>

        <div class="line"></div>

    </div>

</body>

</html>
